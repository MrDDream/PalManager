# Publie une release GitHub quand un tag vX.Y.Z est poussé :
# compile l'APK debug signé avec la clé debug du mainteneur (secret DEBUG_KEYSTORE_BASE64,
# pour que la mise à jour s'installe par-dessus les versions précédentes), le renomme
# PalManager-vX.Y.Z.apk et crée la release avec les notes de release-notes/vX.Y.Z.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check version and notes
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::versionName ($version) does not match the tag ($GITHUB_REF_NAME)"
            exit 1
          fi
          if [ ! -f "release-notes/$GITHUB_REF_NAME.md" ]; then
            echo "::error::Missing release-notes/$GITHUB_REF_NAME.md"
            exit 1
          fi

      - name: Restore the signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret DEBUG_KEYSTORE_BASE64 is missing (base64 of ~/.android/debug.keystore)"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Build
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="PalManager-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --title "PalManager $GITHUB_REF_NAME" \
            --notes-file "release-notes/$GITHUB_REF_NAME.md" \
            --verify-tag
